name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Regenerate and upload visual baselines instead of verifying them
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-only-secret-change-me
  BETTER_AUTH_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:5173
  MONGODB_URI: mongodb://127.0.0.1:27017/casesync_test
  JEV_ENABLED: 'false'
  OVERLAP_AUTO_ASSESS: 'false'
  CRON_ENABLED: 'false'
  STAFF_SIGNUP_ENABLED: 'false'

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - run: bun run typecheck:api
      - run: bun run typecheck:web
      - run: bun run typecheck:web:tests

  unit:
    name: Unit and component tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  integration:
    name: Integration tests and coverage
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore

  build:
    name: Production builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build

  e2e-smoke:
    name: Seeded browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:e2e:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-smoke-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  e2e-full:
    name: Full Chromium E2E
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:e2e:full
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-full-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  e2e-cross-browser:
    name: Cross-browser E2E (${{ matrix.browser }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/web
      # Each browser gets its own service container and seed. Running all three
      # projects against one database lets the first project's mutation specs
      # destroy state the next project's fixtures expect.
      - run: bun run seed:demo
      - name: Run the functional suite in ${{ matrix.browser }}
        working-directory: apps/web
        env:
          PLAYWRIGHT_ALL_BROWSERS: '1'
        run: bunx playwright test --project=${{ matrix.browser }}-desktop --grep-invert "@performance|@visual"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-cross-browser-${{ matrix.browser }}-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  e2e-visual:
    name: Visual regression
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Verify visual baselines
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_visual_snapshots }}
        run: bun run test:e2e:visual
      - name: Regenerate visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots }}
        run: bun run test:e2e:update-snapshots
      - uses: actions/upload-artifact@v7
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots }}
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-visual-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
