name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_snapshots:
        description: Regenerate and upload visual baselines instead of verifying them
        type: boolean
        default: false
      mongo_target:
        description: MongoDB target for this dispatch
        type: choice
        options:
          - local
          - atlas
        default: local
      atlas_scope:
        description: Atlas check scope (only used when mongo_target is atlas)
        type: choice
        options:
          - connectivity
          - smoke
        default: connectivity

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-only-secret-change-me
  BETTER_AUTH_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:5173
  MONGODB_URI: mongodb://127.0.0.1:27017/casesync_test
  JEV_ENABLED: 'false'
  OVERLAP_AUTO_ASSESS: 'false'
  CRON_ENABLED: 'false'
  STAFF_SIGNUP_ENABLED: 'false'

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      - run: bun run typecheck:api
      - run: bun run typecheck:web
      - run: bun run typecheck:web:tests

  unit:
    name: Unit and component tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  integration:
    name: Integration tests and coverage
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore

  build:
    name: Production builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build

  e2e-smoke:
    name: Seeded browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:e2e:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-smoke-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  e2e-full:
    name: Full Chromium E2E
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:e2e:full
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-full-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  e2e-cross-browser:
    # Matrix-free caller so a skipped run renders a clean name. GitHub evaluates
    # a job-level `if` before the matrix and does not expand skipped matrix jobs,
    # which would surface the raw `${{ matrix.browser }}` template. The browser
    # matrix (and its per-browser names) lives in the reusable workflow.
    name: Cross-browser E2E
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/cross-browser-e2e.yml

  e2e-visual:
    name: Visual regression
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Verify visual baselines
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.update_visual_snapshots }}
        run: bun run test:e2e:visual
      - name: Regenerate visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots }}
        run: bun run test:e2e:update-snapshots
      - uses: actions/upload-artifact@v7
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.update_visual_snapshots }}
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-visual-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high

  atlas-smoke:
    # Manual dispatch only. Push/PR runs never use Atlas; the default mongo_target
    # is local. The secret must point at a dedicated disposable casesync_atlas_*
    # database, and the pool is capped so this is a small off-site connection check.
    name: Optional Atlas smoke
    if: github.event_name == 'workflow_dispatch' && inputs.mongo_target == 'atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      MONGODB_URI: ${{ secrets.ATLAS_MONGODB_URI }}
      ATLAS_MONGODB_URI: ${{ secrets.ATLAS_MONGODB_URI }}
      ALLOW_REMOTE_MONGO: '1'
      MONGODB_MAX_POOL_SIZE: '5'
      MONGODB_MAX_IDLE_TIME_MS: '10000'
      BETTER_AUTH_SECRET: ci-only-secret-change-me
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:5173
      JEV_ENABLED: 'false'
      OVERLAP_AUTO_ASSESS: 'false'
      CRON_ENABLED: 'false'
      STAFF_SIGNUP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Check Atlas secret
        id: atlas
        shell: bash
        run: |
          if [[ -z "${ATLAS_MONGODB_URI:-}" ]]; then
            echo "ATLAS_MONGODB_URI secret is not configured; skipping Atlas smoke."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bounded Atlas connectivity check
        if: steps.atlas.outputs.available == 'true'
        working-directory: apps/api
        run: bun run scripts/atlas-smoke.ts
      - name: Seed dedicated Atlas database for optional smoke
        if: steps.atlas.outputs.available == 'true' && inputs.atlas_scope == 'smoke'
        run: bun run seed:demo
      - name: Run single Chromium smoke against Atlas
        if: steps.atlas.outputs.available == 'true' && inputs.atlas_scope == 'smoke'
        working-directory: apps/web
        run: bunx playwright test --project=chromium-desktop --grep @smoke
